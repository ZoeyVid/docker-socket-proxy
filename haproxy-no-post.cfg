global
    ssl-default-bind-curves X25519MLKEM768:x25519
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:EECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-curves X25519MLKEM768:x25519
    ssl-default-server-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:EECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-dh-param-file /tmp/ffdhe4096.pem
    
defaults
    timeout connect 60s
    timeout client 60s
    timeout server 60s

frontend dockerfrontend
    mode tcp
    bind [::]:2375 v4v6
    tcp-request inspect-delay 10s
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend bhttp if HTTP
    default_backend bhttps

backend bhttp
    mode tcp
    server loopback-for-http abns@haproxy-http send-proxy-v2
backend bhttps
    mode tcp
    server loopback-for-https abns@haproxy-https send-proxy-v2
    
frontend http
    mode http
    bind abns@haproxy-http accept-proxy
    http-request deny unless METH_GET
    default_backend dockerbackend

frontend https
    mode http
    bind abns@haproxy-https accept-proxy ssl crt /tmp/cert.pem alpn h2,http/1.1
    http-request deny unless METH_GET
    default_backend dockerbackend

backend dockerbackend
    mode http
    server dockersocket $SOCKET_PATH
